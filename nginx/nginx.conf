# Backend API upstream — single server with passive health checks.
# If the backend fails 3 times within 30s, it is marked as down for 30s.
upstream api {
    server 127.0.0.1:8000 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# Custom error page for upstream failures
# NOTE: proxy_intercept_errors is set OFF by default and only ON inside
# specific location blocks. Application-level errors (4xx, 5xx) from the
# backend are passed through to the client.
error_page 502 503 504 /502.json;

location = /502.json {
    internal;
    default_type application/json;
    return 502 '{"success":false,"code":502,"error":"Server temporarily unavailable. Please try again.","message":"Server temporarily unavailable. Please try again."}';
}

server {
    listen 80;
    server_name grubpac.dynu.net;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name grubpac.dynu.net;

    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 50M;

    # Expose a liveness probe at /healthz that bypasses upstream proxy
    # and returns immediately so the orchestrator knows Nginx is alive.
    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"success":true,"status":"alive"}';
    }

    # Readiness probe — checks the backend's /readyz endpoint.
    # Nginx returns 200 only if the backend is reachable and healthy.
    location = /readyz {
        access_log off;
        proxy_pass http://api/api/v1/common/readyz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 5s;
        proxy_connect_timeout 5s;
        # Do not intercept errors here — we want the actual status code
        proxy_intercept_errors off;
    }

    location /api/v1/ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts — 30s for reads (login should respond in <5s), 5s to connect
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;

        # CRITICAL FIX: Removed http_502 from proxy_next_upstream.
        # The application should return its own error responses (e.g., 503 "service
        # unavailable") rather than having nginx generate 502s.  Retrying on 502
        # causes the same failing request to hit the backend twice, amplifying load
        # during outages and creating the "repeated 502" symptom.
        proxy_next_upstream error timeout invalid_header http_500 http_503;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 10s;

        # Buffer settings for large responses
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;

        # Do not intercept errors from the application's /api/v1/* endpoints —
        # the application should control its own error responses.
        proxy_intercept_errors off;
    }
}
