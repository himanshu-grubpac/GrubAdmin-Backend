name: CI

on:
  pull_request:
    branches:
      - develop
      - staging
      - pre-prod
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Test
        run: bun test

      - name: Build
        run: bun run build
