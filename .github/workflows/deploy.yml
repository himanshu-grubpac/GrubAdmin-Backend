name: Backend CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'GrubAdmin-Backend/**'
      - '.github/workflows/deploy.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/${{ github.repository_owner }}/grubadmin-backend

jobs:
  build-and-push:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: GrubAdmin-Backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_BASE }}/backend-api
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: GrubAdmin-Backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      GHCR_PAT: ${{ secrets.GHCR_PAT }}
      GITHUB_ACTOR: ${{ github.actor }}
      IMAGE_BASE: ${{ env.IMAGE_BASE }}
    steps:
      - name: Deploy to EC2 via Docker Compose
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.SSH_PRODUCTION_HOST }}
          username: ${{ secrets.SSH_PRODUCTION_USER_NAME }}
          key: ${{ secrets.SSH_PRODUCTION_PRIVATE_KEY }}
          envs: IMAGE_BASE,GHCR_PAT,GITHUB_ACTOR
          script: |
            set -e
            echo "=== Logging in to GHCR ==="
            echo "$GHCR_PAT" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

            echo "=== Pulling latest images ==="
            cd grubpac_api

            docker compose -f docker-compose.prod.yml pull
            docker compose -p grubpac -f docker-compose.prod.yml up -d --remove-orphans

            echo "=== Cleaning up old images ==="
            docker image prune -af --filter "until=24h"

            echo "=== Deployment complete ==="
            docker compose -p grubpac -f docker-compose.prod.yml ps

      - name: Done
        run: echo "Backend deployed successfully to EC2"
