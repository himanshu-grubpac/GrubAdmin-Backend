name: Backend CI/CD

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRODUCTION_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Add EC2 host to known_hosts
        run: |
          ssh-keyscan -t ed25519 -H ${{ secrets.SSH_PRODUCTION_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to EC2 via PM2
        run: |
          ssh -i ~/.ssh/id_ed25519 ${{ secrets.SSH_PRODUCTION_USER_NAME }}@${{ secrets.SSH_PRODUCTION_HOST }} << 'EOF'
            set -e
            export PATH="/home/ubuntu/.local/share/fnm/node-versions/v22.22.3/installation/bin:/home/ubuntu/.bun/bin:$PATH"
            echo "=== Pulling latest code ==="
            cd ~/grubadmin-backend/GrubAdmin-Backend
            git stash
            git pull origin main
            echo "=== Stopping running PM2 process ==="
            pm2 delete "${{ secrets.PRODUCTION_PM2_ID }}" || true
            echo "=== Installing dependencies ==="
            bun install
            echo "=== Killing idle database connections ==="
            set -o allexport
            . .env.production 2>/dev/null || true
            set +o allexport
            export AIVEN_ADMIN_PASSWORD="${{ secrets.AIVEN_ADMIN_PASSWORD }}"
            bun src/cmd/kill-idle-connections.ts || true
            echo "=== Running database migrations ==="
            export DATABASE_URL="${DATABASE_URL}&connectionLimit=1"
            bun run db:fix-duplicate-employee-emails
            sleep 3
            success=false
            for i in 1 2 3; do
              echo "Attempt $i: prisma db push..."
              if bun db:push; then
                success=true
                break
              fi
              echo "db:push failed, waiting 5s before retry..."
              sleep 5
            done
            if [ "$success" != "true" ]; then
              echo "db:push failed after 3 attempts"
              exit 1
            fi
            bun db:generate
            echo "=== Starting PM2 process ==="
            cd ~/grubadmin-backend/GrubAdmin-Backend
            pm2 start bun --name "${{ secrets.PRODUCTION_PM2_ID }}" -- start
            pm2 save
            pm2 list
            echo "=== Deployment complete ==="
          EOF

      - name: Done
        run: echo "Backend deployed successfully to EC2"
