services:
  api:
    image: ghcr.io/${GHCR_OWNER:-piyushgrubpac}/grubadmin-backend/backend-api:latest
    build: .
    container_name: grub-api
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: 8000
    ports:
      - "127.0.0.1:8000:8000"
